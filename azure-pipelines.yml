trigger:
- main

pool:
  name: fasil-pool
  demands:
    - Agent.Name -equals shanu

steps:
- task: Maven@3
  displayName: 'Maven Build with Java 17'
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.17'     # ✅ FIXED
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'clean package'
